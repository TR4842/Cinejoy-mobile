name: Android APK

on:
  push:
    branches: [main, 'arena/**']
  pull_request:
  workflow_dispatch:
    inputs:
      build_type:
        description: Gradle task to run
        type: choice
        options: [assembleDebug, assembleRelease]
        default: assembleDebug

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install JS dependencies
        working-directory: app
        run: npm ci

      - name: Type-check, unit-test and bundle the web app
        working-directory: app
        run: |
          npm run typecheck
          npx vitest run
          npm run build

      - name: Scraper tests
        run: node --test server/test/scraper.test.mjs

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      # The ubuntu runner image already ships the Android SDK; make sure the
      # platform/build-tools the project targets are present and licensed.
      - name: Prepare Android SDK
        run: |
          set -e
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "sdk.dir=$SDK" > app/android/local.properties
          echo "Using SDK at $SDK"
          ls "$SDK/platforms" 2>/dev/null | sort | tail -5 || true
          if [ -x "$SDK/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
            "$SDK/cmdline-tools/latest/bin/sdkmanager" --install \
              "platform-tools" "platforms;android-36" "build-tools;36.0.0" > /dev/null 2>&1 || \
              echo "::warning::sdkmanager could not install android-36; Gradle will fetch what it needs"
          fi

      - name: Sync web assets into the native project
        working-directory: app
        run: npx cap sync android

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('app/android/**/*.gradle*', 'app/android/gradle/wrapper/gradle-wrapper.properties') }}

      - name: Build
        working-directory: app/android
        run: |
          set +e
          chmod +x ./gradlew
          java -version || true
          ./gradlew ${{ github.event.inputs.build_type || 'assembleDebug' }} \
            --no-daemon --stacktrace --warning-mode=summary > gradle-build.log 2>&1
          status=$?
          if [ $status -ne 0 ]; then
            echo "---- java ----"; java -version 2>&1 || true
            echo "---- sdk ----"; ls "${ANDROID_HOME}/platforms" 2>/dev/null || true
            echo "---- error ----"; grep -A8 "What went wrong" gradle-build.log | head -20
            ERR=$(grep -A8 "What went wrong" gradle-build.log | tr '\n' ' ' | cut -c1-900)
            [ -z "$ERR" ] && ERR=$(tail -20 gradle-build.log | tr '\n' ' ' | cut -c1-900)
            echo "::error title=Gradle build failed::$ERR"
          else
            tail -5 gradle-build.log
          fi
          exit $status

      - name: Rename artifact
        run: |
          mkdir -p out
          find app/android/app/build/outputs/apk -name '*.apk' -exec cp {} out/cinejoy.apk \;
          ls -la out

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: cinejoy-apk
          path: out/cinejoy.apk
          retention-days: 30

  # Publish a release when a tag is pushed (v1.0.0, v1.1.0 …)
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: apk
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: cinejoy-apk
          path: out
      - uses: softprops/action-gh-release@v2
        with:
          files: out/cinejoy.apk
          generate_release_notes: true

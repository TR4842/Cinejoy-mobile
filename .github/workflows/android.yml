name: Android APK

on:
  push:
    branches: [main, 'arena/**']
  pull_request:
  workflow_dispatch:
    inputs:
      build_type:
        description: Gradle task to run
        type: choice
        options: [assembleDebug, assembleRelease]
        default: assembleDebug

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install JS dependencies
        working-directory: app
        run: npm ci

      - name: Type-check, unit-test and bundle the web app
        working-directory: app
        run: |
          npm run typecheck
          npx vitest run
          npm run build

      - name: Scraper tests
        run: node --test server/test/scraper.test.mjs

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Sync web assets into the native project
        working-directory: app
        run: npx cap sync android

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('app/android/**/*.gradle*', 'app/android/gradle/wrapper/gradle-wrapper.properties') }}

      - name: Build
        working-directory: app/android
        run: |
          chmod +x ./gradlew
          ./gradlew ${{ github.event.inputs.build_type || 'assembleDebug' }} --no-daemon --stacktrace

      - name: Rename artifact
        run: |
          mkdir -p out
          find app/android/app/build/outputs/apk -name '*.apk' -exec cp {} out/cinejoy.apk \;
          ls -la out

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: cinejoy-apk
          path: out/cinejoy.apk
          retention-days: 30

  # Publish a release when a tag is pushed (v1.0.0, v1.1.0 …)
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: apk
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: cinejoy-apk
          path: out
      - uses: softprops/action-gh-release@v2
        with:
          files: out/cinejoy.apk
          generate_release_notes: true

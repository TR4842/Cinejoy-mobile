name: Web app

on:
  push:
    branches: [main, 'arena/**']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Unit tests
        run: npx vitest run
      - name: Build
        run: npm run build
      - name: Scraper tests
        working-directory: .
        run: node --test server/test/scraper.test.mjs

      - uses: actions/upload-artifact@v4
        with:
          name: cinejoy-web
          path: app/dist
          retention-days: 14
